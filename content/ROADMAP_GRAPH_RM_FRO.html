<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Backhaul — RM_FRO Roadmap</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #14161a; color: #e8e8e8; margin: 0; padding: 24px; }
  h1 { margin: 0 0 4px 0; font-size: 20px; }
  .subtitle { color: #9aa0a6; font-size: 13px; margin-bottom: 12px; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; font-size: 12px; color: #cfd3d8; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
  .frontier-banner { background: #123b2a; border: 1px solid #2e7d4a; color: #a6f2c9; padding: 8px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
  svg { background: #1b1e24; border-radius: 8px; border: 1px solid #2a2e36; }
  .node-label { font-size: 11px; fill: #f2f2f2; font-weight: 600; }
  .node-slug { font-weight: 700; fill: #ffe066; }
  .node-sub { font-size: 9px; fill: #cfd3d8; }
  .edge { stroke: #5a6270; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
  .focus-banner { display: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
  .node-group rect { transition: stroke 0.15s ease, filter 0.15s ease; }
  .node-group.focused rect { stroke: #ffe066 !important; stroke-width: 4px !important; filter: drop-shadow(0 0 10px rgba(255, 224, 102, 0.85)); }
  .node-group.focused .node-label { fill: #ffe066; }
</style>
</head>
<body>

<h1>Backhaul — RM_FRO Roadmap</h1>
<div class="subtitle">Generated by `bhrm render-html` — do not hand-edit.</div>

<div class="frontier-banner"><strong>Actionable now:</strong> RM_FRO_001 (FM root), RM_FRO_002 (FM root), RM_FRO_003 (FM root), RM_FRO_004 (FM root), RM_FRO_005 (FM root)</div>

<div id="focus-banner" class="focus-banner"></div>

<div class="legend">
  <div class="legend-item"><span class="swatch" style="background:#2e7d4a;"></span> resolved / superseded</div>
  <div class="legend-item"><span class="swatch" style="background:#1565c0;"></span> open &amp; actionable</div>
  <div class="legend-item"><span class="swatch" style="background:#4a4f58;"></span> open &amp; blocked</div>
  <div class="legend-item"><span class="swatch" style="background:#b8860b;"></span> convergence · reached</div>
  <div class="legend-item"><span class="swatch" style="background:#a3450f; border:1px dashed #ffb27a;"></span> convergence · WIP</div>
</div>

<svg viewBox="0 0 270 380" width="270" height="380" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#5a6270"/></marker></defs>
<g class="node-group" data-id="RM_FRO_001"><rect x="40" y="40" width="190" height="44" rx="6" fill="#1565c0" stroke="#1565c0" stroke-width="2"/><text x="50" y="58" class="node-label">RM_FRO_001 <tspan class="node-slug">fm-root</tspan></text><text x="50" y="72" class="node-sub">FM root</text><title>RM_FRO_001 · fm-root — work · open. FM root</title></g>
<g class="node-group" data-id="RM_FRO_002"><rect x="40" y="104" width="190" height="44" rx="6" fill="#1565c0" stroke="#1565c0" stroke-width="2"/><text x="50" y="122" class="node-label">RM_FRO_002 <tspan class="node-slug">fm-root</tspan></text><text x="50" y="136" class="node-sub">FM root</text><title>RM_FRO_002 · fm-root — work · open. FM root</title></g>
<g class="node-group" data-id="RM_FRO_003"><rect x="40" y="168" width="190" height="44" rx="6" fill="#1565c0" stroke="#1565c0" stroke-width="2"/><text x="50" y="186" class="node-label">RM_FRO_003 <tspan class="node-slug">fm-root</tspan></text><text x="50" y="200" class="node-sub">FM root</text><title>RM_FRO_003 · fm-root — work · open. FM root</title></g>
<g class="node-group" data-id="RM_FRO_004"><rect x="40" y="232" width="190" height="44" rx="6" fill="#1565c0" stroke="#1565c0" stroke-width="2"/><text x="50" y="250" class="node-label">RM_FRO_004 <tspan class="node-slug">fm-root</tspan></text><text x="50" y="264" class="node-sub">FM root</text><title>RM_FRO_004 · fm-root — work · open. FM root</title></g>
<g class="node-group" data-id="RM_FRO_005"><rect x="40" y="296" width="190" height="44" rx="6" fill="#1565c0" stroke="#1565c0" stroke-width="2"/><text x="50" y="314" class="node-label">RM_FRO_005 <tspan class="node-slug">fm-root</tspan></text><text x="50" y="328" class="node-sub">FM root</text><title>RM_FRO_005 · fm-root — work · open. FM root</title></g>
</svg>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var focus = params.get('focus');
  var banner = document.getElementById('focus-banner');
  if (!focus) return;

  focus = focus.trim().toUpperCase();
  var target = document.querySelector('.node-group[data-id="' + focus + '"]');

  banner.style.display = 'block';
  if (target) {
    target.classList.add('focused');
    target.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
    banner.style.background = '#123b2a';
    banner.style.border = '1px solid #2e7d4a';
    banner.style.color = '#a6f2c9';
    banner.textContent = 'Focused on ' + focus + ' — highlighted below.';
  } else {
    banner.style.background = '#4a2f0a';
    banner.style.border = '1px solid #a3661a';
    banner.style.color = '#ffd9a0';
    banner.textContent = 'No node "' + focus + '" in this graph.';
  }
})();
</script>

</body>
</html>
