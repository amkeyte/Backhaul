[project]
name = "backhaul"
version = "0.1.0"
description = "Portable wiki + ticket (passdown) system: foundation + BHT/BHW services + optional modules."
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
docx = ["python-docx"]
shortcuts = ["pylnk3"]
dev = ["pytest"]

[project.scripts]
backhaul-lnk = "backhaul.modules.shortcuts.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backhaul*"]
