[project]
name = "backhaul"
version = "0.1.0"
description = "Portable wiki + ticket (passdown) system: foundation + BHT/BHW services + optional modules."
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
docx = ["python-docx"]
shortcuts = ["pylnk3"]
dev = ["pytest"]

[project.scripts]
backhaul-lnk = "backhaul.modules.shortcuts.cli:main"
bht = "backhaul.services.ticket.cli:main"
bht-install-editmd = "backhaul.modules.handlers.editmd.install:main"
bht-install-openfolder = "backhaul.modules.handlers.openfolder.install:main"
bhw = "backhaul.services.wiki.cli:main"
bhrm = "backhaul.modules.roadmap.cli:main"
bhrole = "backhaul.modules.roles.cli:main"
backhaul = "backhaul.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backhaul*"]

[tool.setuptools.package-data]
"backhaul.services.ticket" = ["templates/*.tmpl"]
"backhaul.services.wiki" = ["templates/*.tmpl"]
"backhaul.modules.roadmap" = ["templates/*.tmpl"]
"backhaul.modules.handlers.editmd" = ["editmd.vbs"]
"backhaul.modules.handlers.openfolder" = ["openfolder.vbs"]
